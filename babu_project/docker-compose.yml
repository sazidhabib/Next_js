version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: betluxa-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: casino_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: betluxa-server
    restart: always
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: casino_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: super_secret_jwt_casino_key_2026
      CLIENT_URL: http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      - mysql

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betluxa-client
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - server

volumes:
  mysql_data:

